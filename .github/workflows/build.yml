# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS
        ]
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace -x runGameTest -x acceptGameTestEula
      - name: capture build artifacts
        if: ${{ matrix.java == '25' }} # Only upload artifacts built from latest java
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  client-gametest:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "microsoft"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: accept GameTest EULA
        run: ./gradlew acceptGameTestEula --stacktrace
      - name: run client GameTests
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace
        env:
          CI: "true"
          JAVA_TOOL_OPTIONS: "-Xmx2G"
      - name: upload client gametest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-output
          path: |
            build/run/**